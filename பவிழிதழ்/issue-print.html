:root{color-scheme:light}body{background:#e9dfcb;color:#34251a;font-family:"Noto Serif Tamil","Latha",serif}.print-toolbar{max-width:900px;margin:18px auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.print-toolbar button,.print-toolbar a{padding:10px 18px;background:#632b28;color:#fff0cc;border:1px solid #b18a50;text-decoration:none;cursor:pointer}.print-book{max-width:900px;margin:0 auto 30px;padding:28px;background:#fffaf0;box-shadow:0 8px 28px #0002}.cover-page{height:1120px;max-height:1120px;display:flex;align-items:center;justify-content:center;break-after:page;page-break-after:always;overflow:hidden;background:#fff}.cover-page img{width:100%;height:100%;object-fit:cover}.cover-missing{border:2px dashed #b18a50;color:#6b2925;padding:40px;text-align:center;width:100%;height:100%;display:grid;place-content:center}.foreword,.quote-page,.toc{padding:35px 28px;min-height:0}.quote-page,.toc{break-after:page;page-break-after:always}.has-quote-page .foreword{break-after:page;page-break-after:always}.foreword h2,.quote-page h2,.toc h2{color:#632b28;border-bottom:2px solid #b18a50;padding-bottom:12px;text-align:center}.foreword .foreword-body{white-space:pre-wrap;line-height:2.1;text-align:justify;margin-top:28px;font-size:1.08rem}.foreword-sign{margin-top:25px;text-align:right;line-height:2}.foreword-signature{display:block;margin:0 0 4px auto;max-height:22mm;max-width:60mm;width:auto;height:auto;object-fit:contain}.foreword-signature[hidden]{display:none}.quote-page{display:flex;flex-direction:column;justify-content:center;text-align:center}.quote-page blockquote{font-size:1.45rem;line-height:2.2;margin:45px 10px}.quote-page .quote-author{margin-top:35px;text-align:right}.toc table{width:100%;border-collapse:collapse;margin-top:25px;font-size:.92rem}.toc th,.toc td{border-bottom:1px solid #d7c5a2;padding:10px 7px;text-align:left}.toc th{color:#632b28}.toc td:first-child,.toc td:last-child{text-align:center;white-space:nowrap}.toc-page{color:inherit;text-decoration:none}.toc-page::after{content:target-counter(attr(href),page)}.category-divider{padding:18px 0;text-align:center;color:#6b2925;border-bottom:1px solid #c8ac7d;margin:18px 0;break-after:avoid-page}.category-divider h2{margin:0}.print-post{padding:14px 8px 20px;break-inside:avoid-page;page-break-inside:avoid}.print-post h2{color:#632b28;text-align:center;font-size:1.55rem;margin:8px 0}.print-post .meta{text-align:center;color:#775b3a;border-bottom:1px solid #dfcfad;padding-bottom:10px;font-size:.9rem}.print-post .body{white-space:pre-wrap;line-height:2.0;font-size:1.03rem;text-align:justify;margin-top:16px}.print-post img{display:block;max-width:65%;max-height:220px;object-fit:contain;margin:12px auto}.print-footer{text-align:center;border-top:1px solid #b18a50;padding:25px;margin-top:30px;color:#6b2925;break-before:page;page-break-before:always}.running-registration{position:fixed;top:-18mm;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;font-size:7pt;color:#765d43;z-index:5}.running-registration img{height:18px;max-width:48px;object-fit:contain}.registration-strip{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;font-size:10px;color:#765d43;margin:8px auto 20px}.registration-strip img{height:26px;max-width:70px;object-fit:contain}

</style></head><body><div class="print-toolbar"><button type="button" onclick="window.print()">PDF ஆகச் சேமி / அச்சிடு</button><a href="admin.html#quarterManager">நிர்வாகப் பக்கத்திற்குத் திரும்பு</a></div><div class="running-registration" id="runningRegistration"></div><main class="print-book"><section class="cover-page" id="frontCover"></section><section class="foreword"><h2>உரிமை / முன்னுரை</h2><div class="foreword-body" id="forewordBody"></div><div class="foreword-sign"><img id="forewordSignature" class="foreword-signature" alt="நிறுவனர் கையொப்பம்" hidden>இயக்குநர் மற்றும் ஒருங்கிணைப்பாளர்<br><strong>எழுத்தாளர் கவிஞர் இரா.பவித்ரா</strong></div></section><section class="quote-page" id="quotePage" hidden><h2>ஆசிரியர் பக்கம்</h2><blockquote id="quoteText"></blockquote><p class="quote-author">— ஆசிரியர்</p></section><section class="toc"><h2>பொருளடக்கம்</h2><table><thead><tr><th>வ.எண்</th><th>தலைப்பு</th><th>ஆசிரியர்</th><th>பக்க எண்</th></tr></thead><tbody id="contentsRows"></tbody></table></section><div id="issuePosts"></div><section class="cover-page" id="backCover"></section></main><script>
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(e){return f}};
const qs=new URLSearchParams(location.search),issueId=qs.get('id'),posts=read('pavizhidhal_posts',[]),issues=read('pavizhidhal_quarterly_issues',[]),issue=issues.find(x=>String(x.id)===String(issueId))||null;
const settings=read('pavizhidhal_site_settings',{}),brand=read('pavizhidhal_certificate_branding',{});
const reg=document.getElementById('runningRegistration');if(settings.issnNumber||settings.udyamNumber||settings.issnLogo||settings.udyamLogo){reg.innerHTML=`${settings.issnLogo?`<img src="${safe(settings.issnLogo)}" alt="ISSN">`:''}${settings.issnNumber?`<span>ISSN: ${safe(settings.issnNumber)}</span>`:''}${settings.udyamLogo?`<img src="${safe(settings.udyamLogo)}" alt="Udyam">`:''}${settings.udyamNumber?`<span>Udyam / MSME: ${safe(settings.udyamNumber)}</span>`:''}`;}
const categories={kavithai:'கவிதை',kathai:'சிறுகதை',katturai:'கட்டுரை',aaivukatturai:'ஆய்வுக் கட்டுரை',kulandhai:'குழந்தை இலக்கியம்'};
function cover(el,url,label){if(url){const img=document.createElement('img');img.src=url;img.alt=label;el.appendChild(img)}else{el.innerHTML=`<div class="cover-missing"><h1>பவிழிதழ்</h1><p>${label} படத்தை நிர்வாகப் பக்கத்தில் நீங்களே தேர்ந்தெடுக்கவும்.</p></div>`}}
function estimatePages(post){const chars=String(post.content||'').length;const image=post.image?700:0;return Math.max(1,Math.ceil((chars+360+image)/2100))}
if(!issue){document.getElementById('issuePosts').innerHTML='<p>இந்த இதழைக் கண்டறிய முடியவில்லை. Admin பக்கத்தில் இதழைச் சேமித்துவிட்டு மீண்டும் திறக்கவும்.</p>'}
else{
 document.title=`${issue.year} ${issue.monthName} காலாண்டு இதழ் – பவிழிதழ்`;
 cover(document.getElementById('frontCover'),issue.frontCoverUrl,'முதல் அட்டைப்படம்');cover(document.getElementById('backCover'),issue.backCoverUrl,'இறுதி அட்டைப்படம்');
 {const sg=document.getElementById('forewordSignature');if(sg&&issue.signatureUrl){sg.src=issue.signatureUrl;sg.hidden=false;}}
 document.getElementById('forewordBody').textContent=issue.foreword||`${issue.year} ஆம் ஆண்டின் ${issue.monthName} காலாண்டு இதழாக பவிழிதழ் வாசகர்களைச் சந்திக்கிறது. தமிழ் இலக்கியம், படைப்பாற்றல் மற்றும் வாசிப்பு ஆர்வத்தை வளர்க்கும் நோக்கில் இவ்விதழ் தொகுக்கப்பட்டுள்ளது.`;
 if(issue.quotePage&&issue.quoteText){document.body.classList.add('has-quote-page');const q=document.getElementById('quotePage');q.hidden=false;document.getElementById('quoteText').textContent=issue.quoteText;}
 const ids=Array.isArray(issue.featuredPostIds)?issue.featuredPostIds:[],chosen=ids.map(id=>posts.find(p=>String(p.id)===String(id))).filter(Boolean),order=['kavithai','kathai','katturai','aaivukatturai','kulandhai'];
 const contents=document.getElementById('contentsRows'),target=document.getElementById('issuePosts');let rowNo=0,estimatedPage=4+(issue.quotePage&&issue.quoteText?1:0);
 const groups=order.map(key=>({key,label:categories[key],items:chosen.filter(p=>p.category===key)})).filter(g=>g.items.length);
 groups.forEach(group=>{const divider=document.createElement('section');divider.className='category-divider';divider.innerHTML=`<h2>${safe(group.label)}</h2><p>❧ பவிழிதழ் இலக்கியத் தொகுப்பு ❧</p>`;target.appendChild(divider);group.items.forEach(post=>{rowNo++;const postAnchor='post-'+String(post.id).replace(/[^a-zA-Z0-9_-]/g,'-');const tr=document.createElement('tr');tr.innerHTML=`<td>${rowNo}</td><td>${safe(post.title||'தலைப்பிடப்படாத படைப்பு')}</td><td>${safe(post.author||'—')}</td><td><a class="toc-page" href="#${postAnchor}" aria-label="பக்க எண்ணைக் காண்க">${estimatedPage}</a></td>`;contents.appendChild(tr);const article=document.createElement('article');article.id=postAnchor;article.className='print-post';article.innerHTML=`<p class="meta">${safe(categories[post.category]||'படைப்பு')} · ${safe(post.author||'எழுத்தாளர்')} · ${safe(post.date||'')}</p><h2>${safe(post.title||'தலைப்பிடப்படாத படைப்பு')}</h2>${post.image?`<img src="${safe(post.image)}" alt="${safe(post.title)}">`:''}<div class="body">${safe(post.content||'').replace(/\n/g,'<br>')}</div>`;target.appendChild(article);estimatedPage+=estimatePages(post);});});
 if(!chosen.length){contents.innerHTML='<tr><td colspan="4">படைப்புகள் தேர்வு செய்யப்படவில்லை.</td></tr>';target.innerHTML='<p>இந்த இதழில் படைப்புகள் சேர்க்கப்படவில்லை.</p>';}
}
