<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>பவிழிதழ் – காலாண்டு இதழ்</title>
<link rel="stylesheet" href="css/styles.css">
<style>
:root{--navy:#17324d;--teal:#167c80;--coral:#d66a58;--gold:#d5a84f;--ink:#263746;--paper:#fffefa}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e8eef3;color:var(--ink);font-family:"Noto Serif Tamil","Latha",serif}
.print-toolbar{max-width:1000px;margin:16px auto;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.print-toolbar button,.print-toolbar a{padding:11px 20px;background:var(--navy);color:#fff;border:0;border-radius:5px;text-decoration:none;cursor:pointer;font:inherit}
.admin-help{width:100%;text-align:center;color:#9b3f34;font-weight:700}.print-tip{width:100%;text-align:center;color:var(--teal);font-size:9pt}
.print-book{max-width:1120px;margin:0 auto 28px;padding:24px;background:#fff;box-shadow:0 8px 28px #17324d20}
.cover-page{height:180mm;min-height:180mm;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;break-after:page;page-break-after:always;background:linear-gradient(145deg,#e4f3f1,#fff5e7 55%,#fbe8e2);border:2px solid var(--teal)}
.cover-page img{width:100%;height:100%;object-fit:cover}
#backCover{break-before:page;page-break-before:always;break-after:auto;page-break-after:auto;margin-top:0}
.cover-missing{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20mm;background:linear-gradient(145deg,#e2f2ef,#fff7e9 58%,#fbe5df);border:8px double var(--gold);color:var(--navy)}
.cover-missing h1{font-size:38pt;margin:0 0 8mm;color:var(--teal)}
.cover-missing p{font-size:12pt;line-height:1.8}
.foreword,.quote-page,.toc{padding:5mm 7mm;background:var(--paper);margin:0 0 5mm;break-inside:auto;page-break-inside:auto}
.foreword{break-after:page;page-break-after:always}
.toc{break-after:page;page-break-after:always}
.foreword h2,.quote-page h2,.toc h2{color:var(--navy);font-size:16pt;text-align:center;margin:0 0 3mm;padding:0 0 2mm;border-bottom:1.5px solid var(--gold)}
.foreword .foreword-body{white-space:pre-wrap;line-height:1.65;text-align:justify;margin:0;font-size:10pt}
.foreword-sign{margin-top:3mm;text-align:right;line-height:1.4;font-size:9pt;color:var(--navy)}
.foreword-signature{display:block;margin:0 0 2px auto;max-height:16mm;max-width:48mm;object-fit:contain}
.foreword-signature[hidden]{display:none}
.quote-page{text-align:center}
.quote-page blockquote{font-size:14pt;line-height:1.8;margin:5mm;color:var(--teal)}
.quote-page .quote-author{text-align:right;color:var(--coral)}
.toc table{width:100%;border-collapse:collapse;font-size:9pt}
.toc th,.toc td{border-bottom:1px solid #d8e4e7;padding:1.6mm 2mm;text-align:left;vertical-align:top}
.toc th{color:#fff;background:var(--navy)}
.toc tr:nth-child(even) td{background:#f1f7f6}
.toc td:first-child,.toc th:first-child{text-align:center;white-space:nowrap;width:14mm}
.toc-page{display:block;color:var(--teal);text-decoration:none;text-align:center}
.toc-page::after{content:target-counter(attr(href),page)}
#issuePosts{display:block;width:100%;column-count:1;column-gap:0;column-rule:0;column-fill:auto}
.print-post{display:block;width:100%;padding:5mm 3mm 6mm;margin:0;break-inside:auto;page-break-inside:auto}
.print-post+.print-post{border-top:1px solid #d8e4e7}
.post-heading-group{display:block;break-after:avoid;page-break-after:avoid}.print-post .category-label{display:table;margin:0 auto 1.5mm;padding:1mm 4mm;border-radius:15px;background:#e7f4f1;border:1px solid #9dcac4;color:var(--teal);font-size:8pt;break-after:avoid;page-break-after:avoid}
.print-post h2{color:var(--navy);text-align:center;font-size:13pt;line-height:1.35;margin:0 0 1.5mm;break-after:avoid;page-break-after:avoid}
 .print-post .work-number{display:table;margin:0 auto 1.5mm;padding:1mm 3mm;border-radius:50%;background:var(--navy);color:#fff;font-size:8pt;font-weight:700}.print-post .meta{text-align:center;color:#8c5a42;border-bottom:1px solid #e8d6bf;padding-bottom:1.5mm;margin:0 0 2mm;font-size:8pt;line-height:1.4;break-after:avoid;page-break-after:avoid}
.print-post .body{display:block;width:100%;white-space:pre-wrap;line-height:1.65;font-size:9.5pt;text-align:justify;overflow-wrap:anywhere;word-spacing:normal;letter-spacing:normal;orphans:3;widows:3;column-count:1;columns:1}
.print-post.poem-post .body{text-align:left;line-height:1.7}
.print-post img{display:block;max-width:85%;max-height:75mm;object-fit:contain;margin:3mm auto;break-inside:avoid;page-break-inside:avoid}
.ad-page{display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #9dcac4;background:#f7fbfa;margin:3mm 0;padding:4mm;color:var(--teal);break-inside:avoid;page-break-inside:avoid}
.ad-page.full{min-height:170mm;break-before:page;page-break-before:always;break-after:page;page-break-after:always}
.ad-page.half{min-height:80mm}
.ad-page.banner{min-height:28mm;max-height:35mm}
.ad-page img{display:block;max-width:100%;max-height:165mm;object-fit:contain;margin:auto}
.ad-page.half img{max-height:78mm}.ad-page.banner img{max-height:30mm}
.ad-placeholder{font-size:13pt}
.running-registration{position:fixed;top:-15mm;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;font-size:7pt;color:var(--teal)}
.running-registration img{height:15px;max-width:42px;object-fit:contain}
@page{size:A4 portrait;margin:18mm 19mm 17mm;@bottom-center{content:counter(page);font-family:serif;font-size:8pt;color:var(--teal)}}
@page :right{margin-left:21mm;margin-right:16mm;@top-center{content:"பவிழிதழ் · தமிழ் இலக்கியக் காலாண்டிதழ்";font-family:"Noto Serif Tamil",serif;font-size:8pt;color:var(--teal)}}
@page :left{margin-left:16mm;margin-right:21mm;@top-center{content:"பவிழிதழ் · காலாண்டு இதழ்";font-family:"Noto Serif Tamil",serif;font-size:8pt;color:var(--teal)}}
@media screen{.print-book{padding:24px}.cover-page{height:180mm;min-height:180mm}.pagedjs_pages{max-width:100%;overflow-x:auto}}
@media print{html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-toolbar{display:none}.print-book{max-width:none;margin:0;padding:0;box-shadow:none}.pagedjs_pages{display:block!important;width:auto!important;margin:0!important}.pagedjs_page{width:auto!important;margin:0!important;box-shadow:none}.cover-page{height:180mm;min-height:180mm}#backCover{break-before:page;page-break-before:always;break-after:auto;page-break-after:auto}.foreword{break-after:page!important;page-break-after:always!important}.toc{break-after:page!important;page-break-after:always!important}.print-post{break-inside:auto;page-break-inside:auto}}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4729946251252363" crossorigin="anonymous"></script>
<link rel="icon" type="image/png" href="images/pavizhithazh-favicon.png?v=20261121"/>
</head>
<body>
<div class="print-toolbar"><button type="button" id="printIssueBtn">இதழை அச்சிடு / PDF ஆகச் சேமி</button><a href="admin.html#quarterManager">நிர்வாகப் பக்கத்திற்குத் திரும்பு</a><small class="print-tip">இருபக்க அச்சுக்கு அச்சுப்பொறி சாளரத்தில் “Print on both sides / இருபக்க அச்சு” என்பதைத் தேர்ந்தெடுக்கவும்.</small></div>
<div class="running-registration" id="runningRegistration"></div>
<main class="print-book">
<section class="cover-page" id="frontCover"></section>
<section class="foreword"><h2>முன்னுரை</h2><div class="foreword-body" id="forewordBody"></div><div class="foreword-sign"><img id="forewordSignature" class="foreword-signature" alt="நிறுவனர் கையொப்பம்" hidden>இயக்குநர் மற்றும் ஒருங்கிணைப்பாளர்<br><strong>எழுத்தாளர் கவிஞர் இரா.பவித்ரா</strong></div></section>
<section class="quote-page" id="quotePage" hidden><h2>ஆசிரியர் பக்கம்</h2><blockquote id="quoteText"></blockquote><p class="quote-author">— ஆசிரியர்</p></section>
<section class="toc"><h2>பொருளடக்கம்</h2><table><thead><tr><th>வ.எண்</th><th>படைப்பின் தலைப்பு</th><th>படைப்பாளர்</th></tr></thead><tbody id="contentsRows"></tbody></table></section>
<div id="issuePosts"></div>
<section class="cover-page" id="backCover"></section>
</main>
<script>
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(e){return f}};
const qs=new URLSearchParams(location.search),issueId=qs.get('id'),posts=read('pavizhidhal_posts',[]),issues=read('pavizhidhal_quarterly_issues',[]),issue=issues.find(x=>String(x.id)===String(issueId))||null;
const settings=read('pavizhidhal_site_settings',{}),reg=document.getElementById('runningRegistration');
if(settings.issnNumber||settings.udyamNumber||settings.issnLogo||settings.udyamLogo){
 reg.innerHTML=`${settings.issnLogo?`<img src="${safe(settings.issnLogo)}" alt="ISSN">`:''}${settings.issnNumber?`<span>ISSN: ${safe(settings.issnNumber)}</span>`:''}${settings.udyamLogo?`<img src="${safe(settings.udyamLogo)}" alt="Udyam">`:''}${settings.udyamNumber?`<span>Udyam / MSME: ${safe(settings.udyamNumber)}</span>`:''}`;
}
const categories={kavithai:'கவிதை',kathai:'சிறுகதை',katturai:'கட்டுரை',aaivukatturai:'இலக்கிய விமர்சனம்',kulandhai:'குழந்தை இலக்கியம்'};
function renderAd(ad){if(!ad||!ad.enabled)return null;const section=document.createElement('section');section.className='ad-page '+(ad.size==='half'?'half':ad.size==='banner'?'banner':'full');section.setAttribute('aria-label','விளம்பரப் பக்கம்');if(ad.imageUrl){const img=document.createElement('img');img.src=ad.imageUrl;img.alt='விளம்பரம்';section.appendChild(img);}else{const label=document.createElement('div');label.className='ad-placeholder';label.textContent='விளம்பர இடம்';section.appendChild(label);}return section;}
function cover(el,url,label){
 if(url){const img=document.createElement('img');img.src=url;img.alt=label;el.appendChild(img);}
 else{const box=document.createElement('div');box.className='cover-missing';const h=document.createElement('h1');h.textContent='பவிழிதழ்';const p=document.createElement('p');p.textContent=label+' படத்தை நிர்வாகப் பக்கத்தில் தேர்ந்தெடுக்கவும்.';box.append(h,p);el.appendChild(box);}
}
if(!issue){
 document.getElementById('issuePosts').textContent='இந்த இதழைக் கண்டறிய முடியவில்லை. நிர்வாகப் பக்கத்தில் இதழைச் சேமித்துவிட்டு மீண்டும் திறக்கவும்.';
}else{
 document.title=`${issue.year} ${issue.monthName} காலாண்டு இதழ் – பவிழிதழ்`;
 if(issue.status!=='published'){const n=document.createElement('p');n.className='admin-help';n.textContent='இது வரைவு முன்னோட்டம்; முழு இதழ் வெளியீட்டுக்கு முன் நிர்வாகப் பக்கத்தில் நிலையை மாற்றவும்.';document.querySelector('.print-toolbar').prepend(n);}
 cover(document.getElementById('frontCover'),issue.frontCoverUrl,'முதல் அட்டைப்படம்');
 cover(document.getElementById('backCover'),issue.backCoverUrl,'இறுதி அட்டைப்படம்');
 const sg=document.getElementById('forewordSignature');if(sg&&issue.signatureUrl){sg.src=issue.signatureUrl;sg.hidden=false;}
 document.getElementById('forewordBody').textContent=(issue.theme?`கருப்பொருள்: ${issue.theme}\n\n`:'')+(issue.editor?`ஆசிரியர் / தொகுப்பாளர்: ${issue.editor}\n\n`:'')+(issue.foreword||`${issue.year} ஆம் ஆண்டின் ${issue.monthName} காலாண்டு இதழாக பவிழிதழ் வாசகர்களைச் சந்திக்கிறது. தமிழ் இலக்கியம், படைப்பாற்றல் மற்றும் வாசிப்பு ஆர்வத்தை வளர்க்கும் நோக்கில் இவ்விதழ் தொகுக்கப்பட்டுள்ளது.`);
 if(issue.quotePage&&issue.quoteText){document.body.classList.add('has-quote-page');const q=document.getElementById('quotePage');q.hidden=false;document.getElementById('quoteText').textContent=issue.quoteText;}
 const adSlots=Array.isArray(issue.adSlots)?issue.adSlots:[];const adAfter=adSlots.filter(x=>x.enabled&&x.position==='after-foreword').map(renderAd).filter(Boolean);adAfter.forEach(x=>document.querySelector('.foreword').after(x));const adMiddle=adSlots.filter(x=>x.enabled&&x.position==='middle').map(renderAd).filter(Boolean);const adEnd=adSlots.filter(x=>x.enabled&&x.position==='before-back').map(renderAd).filter(Boolean);
 const ids=Array.isArray(issue.featuredPostIds)?issue.featuredPostIds:[],chosen=ids.map(id=>posts.find(p=>String(p.id)===String(id))).filter(Boolean);
 const order=['kavithai','kathai','katturai','aaivukatturai','kulandhai'],contents=document.getElementById('contentsRows'),target=document.getElementById('issuePosts');
 let rowNo=0;let middleInserted=false;
 order.forEach(key=>{
  chosen.filter(p=>p.category===key).forEach((post,postIndex)=>{
   rowNo++;
   const postAnchor='post-'+String(post.id).replace(/[^a-zA-Z0-9_-]/g,'-');
   const tr=document.createElement('tr');
   const no=document.createElement('td');no.textContent=String(rowNo);
   const titleCell=document.createElement('td');const titleLink=document.createElement('a');titleLink.className='toc-page';titleLink.href='#'+postAnchor;titleLink.textContent=post.title||'தலைப்பிடப்படாத படைப்பு';titleCell.appendChild(titleLink);
   const authorCell=document.createElement('td');authorCell.textContent=post.author||'—';
   tr.append(no,titleCell,authorCell);contents.appendChild(tr);
   const article=document.createElement('article');article.id=postAnchor;article.className='print-post';article.dataset.category=post.category||'';const lineCount=String(post.content||'').split(/\\r?\\n/).filter(x=>x.trim()).length;if(post.category==='kavithai'){article.classList.add('poem-post');}
   const workNumber=document.createElement('span');workNumber.className='work-number';workNumber.textContent=String(rowNo).padStart(2,'0');
   const category=document.createElement('p');category.className='category-label';category.textContent=categories[post.category]||'படைப்பு';
   const heading=document.createElement('h2');heading.textContent=post.title||'தலைப்பிடப்படாத படைப்பு';
   const meta=document.createElement('p');meta.className='meta';meta.textContent=(post.author||'எழுத்தாளர்')+(post.date?' · '+post.date:'');
   article.append(workNumber,category,heading,meta);
   if(post.image){const img=document.createElement('img');img.src=post.image;img.alt=post.title||'படைப்பு படம்';article.appendChild(img);}
   const body=document.createElement('div');body.className='body';body.textContent=post.content||'';article.appendChild(body);
   target.appendChild(article);if(!middleInserted&&rowNo>=Math.ceil(chosen.length/2)&&adMiddle.length){adMiddle.forEach(ad=>target.appendChild(ad));middleInserted=true;}
  });
 });
 if(!middleInserted&&adMiddle.length){adMiddle.forEach(ad=>target.appendChild(ad));}adEnd.forEach(ad=>document.querySelector('#backCover').before(ad));
 if(!chosen.length){contents.innerHTML='<tr><td colspan="3">படைப்புகள் தேர்வு செய்யப்படவில்லை.</td></tr>';target.textContent='இந்த இதழில் படைப்புகள் சேர்க்கப்படவில்லை.';}
}
</script>

<script>
document.getElementById('printIssueBtn')?.addEventListener('click',()=>{window.focus();window.print();});
window.addEventListener('beforeprint',()=>{document.body.classList.add('printing-issue');});
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing-issue');});
</script>
</body>
</html>
