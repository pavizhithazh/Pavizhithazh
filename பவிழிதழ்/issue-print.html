<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>பவிழிதழ் – காலாண்டு இதழ்</title>
<link rel="stylesheet" href="css/styles.css">
<style>
:root{color-scheme:light;--navy:#17324d;--teal:#167c80;--teal-soft:#e7f4f1;--coral:#d66a58;--gold:#d5a84f;--ink:#263746;--paper:#fffefa;--canvas:#e8eef3}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Noto Serif Tamil","Latha",serif}
.print-toolbar{max-width:900px;margin:18px auto;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.print-toolbar button,.print-toolbar a{padding:11px 20px;background:var(--navy);color:#fff;border:0;border-radius:6px;text-decoration:none;cursor:pointer;font:inherit;box-shadow:0 3px 10px #17324d22}
.print-toolbar button:hover,.print-toolbar a:hover{background:var(--teal)}.admin-help{width:100%;text-align:center;color:#9b3f34;font-weight:700}
.print-book{max-width:900px;margin:0 auto 34px;padding:32px;background:var(--paper);box-shadow:0 12px 36px #17324d20;border-radius:3px}
.cover-page{height:252mm;min-height:252mm;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;break-after:page;page-break-after:always;background:linear-gradient(145deg,#e4f3f1,#fff5e7 55%,#fbe8e2);border:2px solid var(--teal)}
.cover-page img{width:100%;height:100%;object-fit:cover}
.cover-missing{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25mm;background:radial-gradient(circle at top right,#f8d9cc 0,transparent 38%),linear-gradient(145deg,#e2f2ef,#fff7e9 58%,#fbe5df);border:10px double var(--gold);outline:1px solid var(--navy);outline-offset:-17px;color:var(--navy)}
.cover-missing h1{font-size:44pt;letter-spacing:2px;margin:0 0 12mm;color:var(--teal)}.cover-missing p{font-size:13pt;line-height:2}
.foreword,.quote-page,.toc{min-height:0;padding:15mm 12mm;background:var(--paper);break-after:page;page-break-after:always}
.foreword h2,.quote-page h2,.toc h2{color:var(--navy);font-size:22pt;text-align:center;margin:0 0 12mm;padding:0 0 6mm;border-bottom:3px solid var(--gold)}
.foreword .foreword-body{white-space:pre-wrap;line-height:2.15;text-align:justify;text-justify:inter-word;margin-top:8mm;font-size:12pt}
.foreword-sign{margin-top:18mm;text-align:right;line-height:2;font-size:11pt;color:var(--navy)}
.foreword-signature{display:block;margin:0 0 4px auto;max-height:22mm;max-width:60mm;width:auto;height:auto;object-fit:contain}.foreword-signature[hidden]{display:none}
.quote-page{display:flex;flex-direction:column;justify-content:center;text-align:center}.quote-page blockquote{font-size:18pt;line-height:2.2;margin:20mm 8mm;color:var(--teal)}.quote-page .quote-author{margin-top:12mm;text-align:right;color:var(--coral)}
.toc table{width:100%;border-collapse:collapse;margin-top:8mm;font-size:10.5pt}.toc th,.toc td{border-bottom:1px solid #d8e4e7;padding:4mm 2mm;text-align:left;vertical-align:top}.toc th{color:#fff;background:var(--navy)}.toc tr:nth-child(even) td{background:#f1f7f6}
.toc td:first-child,.toc td:last-child,.toc th:first-child,.toc th:last-child{text-align:center;white-space:nowrap;width:13mm}.toc-page{display:block;color:var(--teal);text-decoration:none;text-align:center}.toc-page::after{content:target-counter(attr(href),page)}
.print-post{padding:10mm 3mm 12mm;break-inside:auto;page-break-inside:auto;column-count:1!important;columns:1!important;column-width:auto!important}.print-post+.print-post{border-top:1px solid #d8e4e7}
.print-post .category-label{display:table;margin:0 auto 7mm;padding:2mm 8mm;border-radius:20px;background:var(--teal-soft);border:1px solid #9dcac4;color:var(--teal);font-size:9.5pt;break-after:avoid-page;page-break-after:avoid}
.print-post h2{color:var(--navy);text-align:center;font-size:20pt;line-height:1.7;margin:0 0 4mm;break-after:avoid-page;page-break-after:avoid}
.print-post .meta{text-align:center;color:#8c5a42;border-bottom:1px solid #e8d6bf;padding-bottom:5mm;margin:0 0 8mm;font-size:9.5pt;line-height:1.8;break-after:avoid-page;page-break-after:avoid}
.print-post.keep-together{break-inside:avoid-page;page-break-inside:avoid}.print-post.poem-post .body{white-space:pre-wrap;text-align:left!important;line-height:2.25}.print-post .body{display:block;width:100%;max-width:100%;white-space:pre-wrap;line-height:2.15;font-size:12pt;text-align:left!important;text-justify:none!important;word-spacing:normal!important;letter-spacing:normal!important;overflow-wrap:anywhere;column-count:1!important;columns:1!important;column-width:auto!important}
.print-post img{display:block;max-width:75%;max-height:220px;object-fit:contain;margin:8mm auto;break-inside:avoid;page-break-inside:avoid}
.ad-page{display:flex;align-items:center;justify-content:center;break-inside:avoid;page-break-inside:avoid;text-align:center;border:1px dashed #9dcac4;background:#f7fbfa;margin:8mm 0;padding:8mm;color:#167c80}.ad-page.full{min-height:230mm;break-before:page;page-break-before:always;break-after:page;page-break-after:always}.ad-page.half{min-height:115mm;break-inside:avoid-page;page-break-inside:avoid}.ad-page img{display:block;max-width:100%;max-height:220mm;object-fit:contain;margin:auto}.ad-page.half img{max-height:105mm}.ad-placeholder{font-size:15pt;letter-spacing:1px}.print-footer{text-align:center;border-top:2px solid var(--gold);padding:12mm;margin-top:15mm;color:var(--navy);break-before:page;page-break-before:always}
.running-registration{position:fixed;top:-18mm;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;font-size:7pt;color:var(--teal);z-index:5}.running-registration img{height:18px;max-width:48px;object-fit:contain}
.pagedjs_pages{display:flex!important;flex-direction:column!important;align-items:center!important;width:100%!important;margin:20px auto!important;gap:22px}.pagedjs_page{flex:0 0 auto;width:210mm!important;margin:0!important;background:#fff;box-shadow:0 8px 28px #17324d25}.pagedjs_sheet{width:210mm!important;min-height:297mm!important;background:#fffefa!important}
@page{size:A4;margin:25mm 20mm 22mm;@bottom-center{content:counter(page);font-family:serif;font-size:9pt;color:var(--teal)}}
@page :right{@top-center{content:"பவிழிதழ் · தமிழ் இலக்கியக் காலாண்டிதழ்";font-family:"Noto Serif Tamil",serif;font-size:8pt;color:var(--teal)}}
@page :left{@top-center{content:"பவிழிதழ் · காலாண்டு இதழ்";font-family:"Noto Serif Tamil",serif;font-size:8pt;color:var(--teal)}}
@media screen{.cover-page{height:1050px;min-height:1050px}.print-book{padding:28px}.foreword,.quote-page,.toc{min-height:850px}}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-toolbar{display:none}.print-book{max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}.pagedjs_pages{display:block!important;width:auto!important;margin:0!important}.pagedjs_page{width:210mm!important;margin:0!important;box-shadow:none}.pagedjs_sheet{width:210mm!important;min-height:297mm!important}.cover-page{height:252mm;min-height:252mm;break-after:page;page-break-after:always}.foreword,.quote-page,.toc{min-height:0}.print-post{break-inside:auto;page-break-inside:auto}}
</style>
</head>
<body>
<div class="print-toolbar"><button type="button" id="printIssueBtn">இதழை அச்சிடு / PDF ஆகச் சேமி</button><a href="admin.html#quarterManager">நிர்வாகப் பக்கத்திற்குத் திரும்பு</a></div>
<div class="running-registration" id="runningRegistration"></div>
<main class="print-book">
<section class="cover-page" id="frontCover"></section>
<section class="foreword"><h2>முன்னுரை</h2><div class="foreword-body" id="forewordBody"></div><div class="foreword-sign"><img id="forewordSignature" class="foreword-signature" alt="நிறுவனர் கையொப்பம்" hidden>இயக்குநர் மற்றும் ஒருங்கிணைப்பாளர்<br><strong>எழுத்தாளர் கவிஞர் இரா.பவித்ரா</strong></div></section>
<section class="quote-page" id="quotePage" hidden><h2>ஆசிரியர் பக்கம்</h2><blockquote id="quoteText"></blockquote><p class="quote-author">— ஆசிரியர்</p></section>
<section class="toc"><h2>பொருளடக்கம்</h2><table><thead><tr><th>வ.எண்</th><th>படைப்பின் தலைப்பு</th><th>படைப்பாளர்</th><th>பக்கம்</th></tr></thead><tbody id="contentsRows"></tbody></table></section>
<div id="issuePosts"></div>
<section class="cover-page" id="backCover"></section>
</main>
<script>
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(e){return f}};
const qs=new URLSearchParams(location.search),issueId=qs.get('id'),posts=read('pavizhidhal_posts',[]),issues=read('pavizhidhal_quarterly_issues',[]),issue=issues.find(x=>String(x.id)===String(issueId))||null;
const settings=read('pavizhidhal_site_settings',{}),reg=document.getElementById('runningRegistration');
if(settings.issnNumber||settings.udyamNumber||settings.issnLogo||settings.udyamLogo){
 reg.innerHTML=`${settings.issnLogo?`<img src="${safe(settings.issnLogo)}" alt="ISSN">`:''}${settings.issnNumber?`<span>ISSN: ${safe(settings.issnNumber)}</span>`:''}${settings.udyamLogo?`<img src="${safe(settings.udyamLogo)}" alt="Udyam">`:''}${settings.udyamNumber?`<span>Udyam / MSME: ${safe(settings.udyamNumber)}</span>`:''}`;
}
const categories={kavithai:'கவிதை',kathai:'சிறுகதை',katturai:'கட்டுரை',aaivukatturai:'ஆய்வுக் கட்டுரை',kulandhai:'குழந்தை இலக்கியம்'};
function renderAd(ad){if(!ad||!ad.enabled)return null;const section=document.createElement('section');section.className='ad-page '+(ad.size==='half'?'half':'full');section.setAttribute('aria-label','விளம்பரப் பக்கம்');if(ad.imageUrl){const img=document.createElement('img');img.src=ad.imageUrl;img.alt='விளம்பரம்';section.appendChild(img);}else{const label=document.createElement('div');label.className='ad-placeholder';label.textContent='விளம்பர இடம்';section.appendChild(label);}return section;}
function cover(el,url,label){
 if(url){const img=document.createElement('img');img.src=url;img.alt=label;el.appendChild(img);}
 else{const box=document.createElement('div');box.className='cover-missing';const h=document.createElement('h1');h.textContent='பவிழிதழ்';const p=document.createElement('p');p.textContent=label+' படத்தை நிர்வாகப் பக்கத்தில் தேர்ந்தெடுக்கவும்.';box.append(h,p);el.appendChild(box);}
}
if(!issue){
 document.getElementById('issuePosts').textContent='இந்த இதழைக் கண்டறிய முடியவில்லை. நிர்வாகப் பக்கத்தில் இதழைச் சேமித்துவிட்டு மீண்டும் திறக்கவும்.';
}else{
 document.title=`${issue.year} ${issue.monthName} காலாண்டு இதழ் – பவிழிதழ்`;
 if(issue.status!=='published'){const n=document.createElement('p');n.className='admin-help';n.textContent='இது வரைவு முன்னோட்டம்; முழு இதழ் வெளியீட்டுக்கு முன் நிர்வாகப் பக்கத்தில் நிலையை மாற்றவும்.';document.querySelector('.print-toolbar').prepend(n);}
 cover(document.getElementById('frontCover'),issue.frontCoverUrl,'முதல் அட்டைப்படம்');
 cover(document.getElementById('backCover'),issue.backCoverUrl,'இறுதி அட்டைப்படம்');
 const sg=document.getElementById('forewordSignature');if(sg&&issue.signatureUrl){sg.src=issue.signatureUrl;sg.hidden=false;}
 document.getElementById('forewordBody').textContent=(issue.theme?`கருப்பொருள்: ${issue.theme}\n\n`:'')+(issue.editor?`ஆசிரியர் / தொகுப்பாளர்: ${issue.editor}\n\n`:'')+(issue.foreword||`${issue.year} ஆம் ஆண்டின் ${issue.monthName} காலாண்டு இதழாக பவிழிதழ் வாசகர்களைச் சந்திக்கிறது. தமிழ் இலக்கியம், படைப்பாற்றல் மற்றும் வாசிப்பு ஆர்வத்தை வளர்க்கும் நோக்கில் இவ்விதழ் தொகுக்கப்பட்டுள்ளது.`);
 if(issue.quotePage&&issue.quoteText){document.body.classList.add('has-quote-page');const q=document.getElementById('quotePage');q.hidden=false;document.getElementById('quoteText').textContent=issue.quoteText;}
 const adSlots=Array.isArray(issue.adSlots)?issue.adSlots:[];const adAfter=adSlots.filter(x=>x.enabled&&x.position==='after-foreword').map(renderAd).filter(Boolean);adAfter.forEach(x=>document.querySelector('.foreword').after(x));const adMiddle=adSlots.filter(x=>x.enabled&&x.position==='middle').map(renderAd).filter(Boolean);const adEnd=adSlots.filter(x=>x.enabled&&x.position==='before-back').map(renderAd).filter(Boolean);
 const ids=Array.isArray(issue.featuredPostIds)?issue.featuredPostIds:[],chosen=ids.map(id=>posts.find(p=>String(p.id)===String(id))).filter(Boolean);
 const order=['kavithai','kathai','katturai','aaivukatturai','kulandhai'],contents=document.getElementById('contentsRows'),target=document.getElementById('issuePosts');
 let rowNo=0;let middleInserted=false;
 order.forEach(key=>{
  chosen.filter(p=>p.category===key).forEach((post,postIndex)=>{
   rowNo++;
   const postAnchor='post-'+String(post.id).replace(/[^a-zA-Z0-9_-]/g,'-');
   const tr=document.createElement('tr');
   const no=document.createElement('td');no.textContent=String(rowNo);
   const titleCell=document.createElement('td');const titleLink=document.createElement('a');titleLink.className='toc-page';titleLink.href='#'+postAnchor;titleLink.textContent=post.title||'தலைப்பிடப்படாத படைப்பு';titleCell.appendChild(titleLink);
   const authorCell=document.createElement('td');authorCell.textContent=post.author||'—';
   const pageCell=document.createElement('td');const pageLink=document.createElement('a');pageLink.className='toc-page';pageLink.href='#'+postAnchor;pageLink.setAttribute('aria-label','பக்க எண்ணைக் காண்க');pageCell.appendChild(pageLink);
   tr.append(no,titleCell,authorCell,pageCell);contents.appendChild(tr);
   const article=document.createElement('article');article.id=postAnchor;article.className='print-post';article.dataset.category=post.category||'';const lineCount=String(post.content||'').split(/\\r?\\n/).filter(x=>x.trim()).length;if(lineCount<=18){article.classList.add('keep-together');}if(post.category==='kavithai'){article.classList.add('poem-post');}
   const category=document.createElement('p');category.className='category-label';category.textContent=categories[post.category]||'படைப்பு';
   const heading=document.createElement('h2');heading.textContent=post.title||'தலைப்பிடப்படாத படைப்பு';
   const meta=document.createElement('p');meta.className='meta';meta.textContent=(post.author||'எழுத்தாளர்')+(post.date?' · '+post.date:'');
   article.append(category,heading,meta);
   if(post.image){const img=document.createElement('img');img.src=post.image;img.alt=post.title||'படைப்பு படம்';article.appendChild(img);}
   const body=document.createElement('div');body.className='body';body.textContent=post.content||'';article.appendChild(body);
   target.appendChild(article);if(!middleInserted&&rowNo>=Math.ceil(chosen.length/2)&&adMiddle.length){adMiddle.forEach(ad=>target.appendChild(ad));middleInserted=true;}
  });
 });
 if(!middleInserted&&adMiddle.length){adMiddle.forEach(ad=>target.appendChild(ad));}adEnd.forEach(ad=>document.querySelector('#backCover').before(ad));
 if(!chosen.length){contents.innerHTML='<tr><td colspan="4">படைப்புகள் தேர்வு செய்யப்படவில்லை.</td></tr>';target.textContent='இந்த இதழில் படைப்புகள் சேர்க்கப்படவில்லை.';}
}
</script>
<script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>
<script>
document.getElementById('printIssueBtn')?.addEventListener('click',()=>{window.focus();window.print();});
window.addEventListener('beforeprint',()=>{document.body.classList.add('printing-issue');});
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing-issue');});
</script>
</body>
</html>
