<style>
.paviz-update-info {
  text-align: center;
  font-size: 11px;
  color: #888;
  padding: 7px;
  margin: 5px auto;
}
</style>

<script>
async function loadWebsiteUpdateDate() {
  const dateElement = document.getElementById("websiteUpdateDate");
  if (!dateElement) return;
  try {
    const updatedDate = await PaviDB.getWebsiteUpdatedDate();
    if (!updatedDate) {
      dateElement.textContent = "தகவல் கிடைக்கவில்லை";
      return;
    }
    const date = new Date(updatedDate + "T00:00:00");
    dateElement.textContent = date.toLocaleDateString("ta-IN");
  } catch (error) {
    console.error("Website update date:", error);
    dateElement.textContent = "தகவல் கிடைக்கவில்லை";
  }
}
window.addEventListener("load", loadWebsiteUpdateDate);
</script>
